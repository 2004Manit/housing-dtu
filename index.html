    Hero image preloads used to live here, pointing at ImageKit URLs. They were

    them. The hero's own <img> carries fetchPriority="high", and HeroSection.tsx
    injects a preload for the first carousel card at runtime.

    Also removed: a preload for best-video-new.jpg, which no longer existed --
    nothing on the site referenced it, so every page load was fetching an
    unused image.
